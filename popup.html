<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Quest Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <header>
    <img src="icons/icon16.png" class="logo" alt="Study Quest">
    Study Quest Extension
  </header>
  <div class="container">
    <div id="alert" class="alert hidden" role="status" aria-live="polite"></div>

    <form id="replyForm">
      <h3 class="section-title">Nova Resposta</h3>

      <div class="form-group">
        <label for="replyTitle">Título</label>
        <input type="text" id="replyTitle" name="replyTitle" autocomplete="off"
          placeholder="Ex.: Saudação inicial" required>
      </div>

      <div class="form-group">
        <label for="replyCategory">Categoria</label>
        <div id="categorySelectWrap" class="input-row">
          <select id="replyCategory" name="replyCategory" class="field">
            <option value="" disabled selected>Selecione uma categoria...</option>
          </select>
          <button type="button" id="btnNewCategory" class="btn-icon" title="Criar nova categoria"
            aria-label="Criar nova categoria">+</button>
        </div>
        <div id="categoryInputWrap" class="input-row is-hidden">
          <input type="text" id="newCategoryInput" name="newCategoryInput" class="field" autocomplete="off"
            placeholder="Ex.: Admissions">
          <button type="button" id="btnCancelCategory" class="btn-icon btn-icon-danger" title="Cancelar"
            aria-label="Cancelar nova categoria">✕</button>
        </div>
      </div>

      <div class="form-group">
        <label for="replyText">Texto da Resposta</label>
        <textarea id="replyText" name="replyText" placeholder="Digite a resposta completa aqui..." required
          rows="4"></textarea>
      </div>

      <button type="submit" id="submitBtn">Adicionar Resposta Rápida</button>
    </form>

    <div class="list-header">
      <h3 class="section-title">Minhas Respostas</h3>
      <button type="button" id="btnDeleteCategory" class="btn-danger-outline is-hidden"
        title="Excluir categoria selecionada">Excluir categoria</button>
    </div>
    <div id="repliesList"></div>
  </div>

  <script src="browser-api.js"></script>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>

</html>
