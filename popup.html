<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Quest Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <header>
    <img src="icons/icon16.png" class="logo" alt="Logo">
    Study Quest Extension
  </header>
  <div class="container">
    <div id="alert" class="alert hidden"></div>

    <form id="replyForm">
      <h3 class="section-title">Nova Resposta</h3>
      <label for="replyTitle">Título</label>
      <input type="text" id="replyTitle" placeholder="Ex: Saudação inicial" required>

      <div class="form-group">
        <label for="replyCategory">Categoria</label>
        <div id="categorySelectWrap" style="display: flex; gap: 8px;">
          <select id="replyCategory"
            style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px;">
            <option value="" disabled selected>Selecione uma categoria...</option>
          </select>
          <button type="button" id="btnNewCategory"
            style="padding: 0 15px; background: #e0e0e0; color: #333; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s;"
            title="Criar nova categoria">+</button>
        </div>
        <div id="categoryInputWrap" style="display: none; gap: 8px;">
          <input type="text" id="newCategoryInput" placeholder="Nome da nova categoria..."
            style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px;">
          <button type="button" id="btnCancelCategory"
            style="padding: 0 15px; background: #ffebee; color: #c62828; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s;"
            title="Cancelar">✕</button>
        </div>
      </div>

      <div class="form-group">
        <label for="replyText">Texto da Resposta</label>
        <textarea id="replyText" placeholder="Digite a resposta completa aqui..." required rows="4"></textarea>
      </div>

      <button type="submit" id="submitBtn">Adicionar Resposta Rápida</button>
    </form>

    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 24px; margin-bottom: 12px;">
      <h3 class="section-title" style="margin: 0;">Minhas Respostas</h3>
      <button type="button" id="btnDeleteCategory"
        style="padding: 4px 10px; background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; border-radius: 4px; cursor: pointer; font-size: 11px; display: none;"
        title="Excluir categoria selecionada">🗑️ Excluir Categoria</button>
    </div>
    <div id="repliesList"></div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
