<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Quest Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <header>
    <img src="icons/icon16.png" class="logo" alt="Logo">
    Study Quest Extension
  </header>
  <div class="container">
    <div id="alert" class="alert hidden"></div>

    <form id="replyForm">
      <h3 class="section-title">Nova Resposta</h3>
      <label for="replyTitle">Título</label>
      <input type="text" id="replyTitle" placeholder="Ex: Saudação inicial" required>

      <label for="replyText">Texto da resposta</label>
      <textarea id="replyText" placeholder="Digite o texto que será inserido..." required></textarea>

      <button type="submit" id="submitBtn">Adicionar Resposta Rápida</button>
    </form>

    <h3 class="section-title" style="margin-top: 24px;">Minhas Respostas</h3>
    <div id="repliesList"></div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
